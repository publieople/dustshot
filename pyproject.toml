[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dustshot"
version = "0.3.0"
description = "Wayland-native screenshot, annotation and pinboard tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "publieople" }]
keywords = ["screenshot", "wayland", "gtk4", "annotation", "ocr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
gtk = ["PyGObject>=3.44", "pycairo>=1.24"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
dustshot = "dustshot.cli:main"

[project.urls]
Homepage = "https://github.com/publieople/dustshot"
Issues = "https://github.com/publieople/dustshot/issues"
Changelog = "https://github.com/publieople/dustshot/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dustshot = ["locale/*/LC_MESSAGES/*.mo"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# The interface text is Chinese, so full-width punctuation is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# GTK has to be imported after the layer-shell preload dance, and the CLI
# only pulls in GTK inside the commands that need it.
"src/dustshot/ui/*.py" = ["E402"]
"src/dustshot/cli.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
